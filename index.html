<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>boat race</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d3b52">
<meta name="apple-mobile-web-app-title" content="boat race">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 水面のブルーを地に、勝負だけ信号オレンジ。上にヘッダー、下にタブバーの1画面アプリ */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14212b; --muted:#5f707d; --line:#d6dee4;
  --deep:#0d3b52; --deep-ink:#ffffff; --accent:#ff6a13; --accent-soft:#fff0e6;
  --good:#1a8a4a; --bad:#c23a32; --chip:#e4ebf0;
  --c1:#ffffff; --c2:#1b1b1b; --c3:#e0262b; --c4:#1d5bd6; --c5:#f3c623; --c6:#1f9a4c;
  --display:"Barlow Condensed","Noto Sans JP",sans-serif; --body:"Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b141a; --surface:#13212b; --ink:#e6eef3; --muted:#93a6b3; --line:#24394a;
  --deep:#07202d; --deep-ink:#e6eef3; --accent:#ff7b2e; --accent-soft:#3a2214;
  --good:#46c37b; --bad:#ff6b61; --chip:#1d3140; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b141a; --surface:#13212b; --ink:#e6eef3; --muted:#93a6b3; --line:#24394a;
  --deep:#07202d; --deep-ink:#e6eef3; --accent:#ff7b2e; --accent-soft:#3a2214;
  --good:#46c37b; --bad:#ff6b61; --chip:#1d3140; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
header.top{background:var(--deep);color:var(--deep-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:900;letter-spacing:.04em;flex:1}
header.top .date{font-family:var(--display);font-size:20px;font-weight:700}
header.top .back{font-size:22px;width:28px;text-align:left}
.demo{background:var(--accent-soft);color:var(--ink);font-size:12px;padding:6px 16px;border-bottom:1px solid var(--line)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--deep);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:var(--accent)}}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:var(--accent)}
h2{font-size:14px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.pl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pl-row div{display:flex;flex-direction:column}
.pl-row small{color:var(--muted);font-size:11px}
.pl-row b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.pos{color:var(--good)} .neg{color:var(--bad)}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.rec.shobu{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.rec .place{font-weight:900;font-size:17px}
.rec .place .num{font-size:22px;margin-left:4px}
.rec .time{font-family:var(--display);font-size:20px;font-weight:700;text-align:right}
.rec .time small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:400}
.rec .sub{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.勝負{background:var(--accent);color:#fff}
.chip.まくり{background:#1d5bd6;color:#fff} .chip.まくり差し{background:#7a3fc4;color:#fff} .chip.人気{background:#5f707d;color:#fff}
.stars{color:var(--accent);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--line)}
.tickets{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.ticket{font-family:var(--display);font-size:17px;font-weight:700;background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.ticket small{font-family:var(--body);font-size:11px;font-weight:500;margin-right:4px}
.venues{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.venues::-webkit-scrollbar{display:none}
.venues button{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.venues button[aria-selected="true"]{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}
.venues button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.races{display:flex;flex-direction:column;gap:6px}
.race{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.race .r{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.race .nm{font-size:13px;color:var(--muted)}
.race .dl{font-family:var(--display);font-size:18px;font-weight:600;text-align:right}
.race.done{opacity:.5}
.race.done .dl::after{content:" 終了";font-family:var(--body);font-size:11px}
.sep{font-size:12px;color:var(--muted);padding:6px 2px 0}
/* レース詳細 */
.rhead{background:var(--deep);color:var(--deep-ink);padding:10px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.rhead .r{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.rhead .meta{font-size:12px;opacity:.85}
.rtabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.rtabs button{flex:1;padding:10px 0;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.rtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
table{border-collapse:collapse;width:100%}
.scroll{overflow-x:auto}
.entry{width:100%}
.entry td,.entry th{padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}
.entry th{font-size:11px;color:var(--muted);font-weight:500}
.entry .n{font-family:var(--display);font-size:17px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.waku{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;font-family:var(--display);
  font-weight:700;font-size:18px;border-radius:4px;border:1px solid #9aa7b1}
.w1{background:var(--c1);color:#111}.w2{background:var(--c2);color:#fff}.w3{background:var(--c3);color:#fff}
.w4{background:var(--c4);color:#fff}.w5{background:var(--c5);color:#111}.w6{background:var(--c6);color:#fff}
.name{font-weight:700;font-size:14px;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.cls{font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--chip)}
.cls.A1{background:#ffe08a;color:#5a4300}
.detail td{background:var(--bg);padding:10px 12px}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dgrid div{display:flex;flex-direction:column}
.dgrid small{font-size:11px;color:var(--muted)}
.dgrid b{font-family:var(--display);font-size:19px;font-weight:700}
.kim{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.panel{display:flex;flex-direction:column;gap:12px;padding:14px 16px 28px;max-width:720px;margin:0 auto}
.lead{font-size:14px;line-height:1.7}
.svgbox{border-radius:10px;overflow:hidden}
.svgbox svg{width:100%;height:auto;display:block}
.cap{font-size:11px;color:var(--muted);margin-top:4px}
.kv{width:100%}
.kv td,.kv th{padding:6px;border-bottom:1px solid var(--line);font-size:13px;text-align:center}
.kv th{font-size:11px;color:var(--muted);font-weight:500}
.kv .best{color:var(--accent);font-weight:700}
.tk{width:100%}
.tk td{padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px}
.tk .c{font-family:var(--display);font-size:20px;font-weight:700}
.tk .p{font-family:var(--display);font-size:17px;text-align:right}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.ptabs{display:flex;gap:4px}
.ptabs button{flex:1;padding:6px 0;border-radius:6px;font-family:var(--display);font-weight:700;font-size:18px;border:2px solid transparent}
.ptabs button[aria-selected="true"]{border-color:var(--accent)}
.hist{font-size:13px}
.hist th,.hist td{border:1px solid var(--line);padding:4px 2px;text-align:center;min-width:34px}
.hist th{background:var(--deep);color:var(--deep-ink);font-weight:500;font-size:11px}
.hist td.lab{background:var(--chip);font-size:11px;font-weight:700;width:30px;min-width:30px}
.hist td{font-family:var(--display);font-size:17px;font-weight:600;background:var(--surface)}
.hist td.shin{font-weight:700;border-color:var(--line)}
.hist td.w1{background:#ffffff;color:#111}.hist td.w2{background:#1b1b1b;color:#fff;box-shadow:inset 0 0 0 2px #8a8a8a}.hist td.w3{background:#e0262b;color:#fff}
.hist td.w4{background:#1d5bd6;color:#fff}.hist td.w5{background:#f3c623;color:#111}.hist td.w6{background:#1f9a4c;color:#fff}
.hist td.f1,.legend i.f1{background:#e0262b;color:#fff;font-weight:700}
.hist td.f2,.legend i.f2{background:#ffd6d1;color:#a3161a;font-weight:700}
.hist td.f3,.legend i.f3{background:#ffeccf;color:#8a5200;font-weight:700}
.hist td.f4,.legend i.f4{color:var(--muted);font-weight:500}
.hist td.fx,.legend i.fx{color:#7a3fc4;font-weight:700}

/* 公式アプリ風の表（テーマに関係なく明るい表） */
.of-wrap{background:#fff;color:#111;border-radius:8px;overflow:hidden;border:1px solid #c9c9c9}
.prof-name{display:flex;align-items:center;gap:8px;padding:10px;font-size:16px}
.prof-name .cls{background:#e9e9e9}
.of{border-collapse:collapse;width:100%}
.of th,.of td{border:1px solid #bdbdbd;text-align:center;padding:4px 2px}
.prof th{background:#6b6b6b;color:#fff;font-size:12px;font-weight:700;width:18%}
.prof td{background:#fff;font-family:var(--display);font-size:20px;font-weight:700}
.prof td small{font-size:13px}
.bar{background:linear-gradient(#2a6fb0,#174a7c);color:#fff;font-weight:700;font-size:16px;padding:6px 10px;margin-top:2px}
.bar .y{color:#ffe14d}
.of thead th{background:#2b2b2b;color:#fff;font-size:12px;font-weight:500;padding:6px 2px}
.of th.lab{background:#3a8f9c;color:#fff;font-size:12px;font-weight:700;width:30px;min-width:30px}
.of thead th.lab{background:#2b2b2b}
.of td{background:#fff;font-family:var(--display);font-size:19px;font-weight:700;min-width:30px;height:38px}
.of tr.gray td{background:#d9d9d9}
.of td.jp{font-family:var(--body);font-size:17px;font-weight:900}
.of td.ym{font-size:13px;line-height:1.1}
.of td.w1{background:#fff;color:#111}.of td.w2{background:#1b1b1b;color:#fff}.of td.w3{background:#e0262b;color:#fff}
.of td.w4{background:#1d5bd6;color:#fff}.of td.w5{background:#f3c623;color:#111}.of td.w6{background:#1f9a4c;color:#fff}
.of td.f1{background:#e0262b;color:#fff}.of td.f2{background:#ffd6d1;color:#a3161a}.of td.f3{background:#ffeccf;color:#8a5200}
.of td.f4{color:#555;font-weight:600}.of td.fx{color:#7a3fc4}
.setsu td{min-width:30px}
/* オッズ（公式アプリ風） */
.odds-wrap{background:#fff;color:#111;border:1px solid #bdbdbd;border-radius:6px;overflow:hidden}
.ohead{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;padding:4px 8px;border-top:2px solid #bdbdbd}
.ohead .on{font-family:var(--display);font-size:22px;width:22px;text-align:center}
.ohead.w1{background:#e6e6e6;color:#111}.ohead.w2{background:#111;color:#fff}.ohead.w3{background:#c42a24;color:#fff}
.ohead.w4{background:#2a5fc4;color:#fff}.ohead.w5{background:#f3d54a;color:#111}.ohead.w6{background:#4e9a3f;color:#fff}
.ogrid{display:grid;grid-template-columns:repeat(5,1fr)}
.og{display:grid;grid-template-columns:14px 15px 1fr;grid-auto-rows:30px;border-left:1px solid #bdbdbd}
.og:first-child{border-left:0}
.og .o2{grid-row:1 / span 4;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px}
.o3,.ob{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:15px;border-bottom:1px solid #fff}
.ov{display:flex;align-items:center;justify-content:flex-end;padding-right:3px;font-family:var(--display);font-weight:700;font-size:16px;border-bottom:1px solid #d0d0d0;background:#fff}
.ov.pv{font-size:14px;color:#555}
.ov i{font-style:normal;font-size:10px}
.ov.pick{background:#ffe2cc;color:#c24a00}
.ogrid.ex{grid-template-columns:repeat(5,1fr)}
.og1{display:grid;grid-template-columns:18px 1fr;height:32px;border-left:1px solid #bdbdbd}
.og1:first-child{border-left:0}
.o2.w1,.o3.w1,.ob.w1{background:#e6e6e6;color:#111}.o2.w2,.o3.w2,.ob.w2{background:#111;color:#fff}.o2.w3,.o3.w3,.ob.w3{background:#c42a24;color:#fff}
.o2.w4,.o3.w4,.ob.w4{background:#2a5fc4;color:#fff}.o2.w5,.o3.w5,.ob.w5{background:#f3d54a;color:#111}.o2.w6,.o3.w6,.ob.w6{background:#4e9a3f;color:#fff}
.logo{border-radius:7px;display:block}
.setup ol{margin:8px 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;margin-top:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:6.5em;overflow:auto;margin-top:8px;user-select:all;-webkit-user-select:all}
.inp{display:block;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px}
.pat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--surface)}
.pat[open]{box-shadow:0 1px 6px rgba(0,0,0,.08)}
.pat summary{list-style:none;font-weight:400}
.pat summary::-webkit-details-marker{display:none}
.pat-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pat-h b{font-size:15px}
.pbadge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted)}
.pat.使える .pbadge{background:var(--good);color:#fff}
.pat.様子見 .pbadge{background:#e0a100;color:#fff}
.pat.不調{opacity:.75}
.pat-m{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.pat-m .tk{flex:0 0 auto;width:auto;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.pat-m .roi{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;text-align:right}
.pat-m .roi small{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:400;margin-right:4px}
.up{color:var(--good)} .down{color:var(--bad)}
.pat-s{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.pat-s b{font-weight:700}
.cond{margin:10px 0 6px;padding-left:18px;font-size:13px}
.cond li{margin:2px 0}
.kvs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center}
.kvs b{display:block;font-size:15px;color:var(--ink)}
.bar-t.yr{position:relative}
.bar-t.yr i.up{background:var(--good)} .bar-t.yr i.down{background:var(--bad)}
.bar-t.yr em{position:absolute;top:-2px;bottom:-2px;border-left:1.5px dashed var(--ink);opacity:.5}
.yrs .barrow{grid-template-columns:40px 1fr 88px}
.barrow small{font-weight:400;color:var(--muted);font-size:10px}
tr.hit td{background:var(--accent-soft)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.ov.ev{box-shadow:inset 0 -3px 0 #1a8a4a}
.tk td.p.hit{font-size:13px}
.bank{display:flex;align-items:baseline;gap:4px;margin:4px 0}
.bank b{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.row{display:flex;gap:8px;align-items:center}
.row .inp{margin:0;flex:1}.row .btn{margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column}
.bg{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.bg-head:disabled{cursor:default;color:inherit}
.bg-date{font-family:var(--display);color:var(--muted)}
.go{font-size:12px;color:var(--accent);font-weight:700}
.bl{display:grid;grid-template-columns:auto auto 1fr auto auto auto auto;gap:8px;align-items:center;padding:7px 12px;font-size:13px;border-top:1px solid var(--line)}
.bl:first-of-type{border-top:0}
.bl.skipped{opacity:.55}
.mini.ok{color:var(--good)}
.bl .num{font-family:var(--display);font-size:16px}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--chip)}
.tag.rule{background:var(--accent);color:#fff}
.hitchip{background:var(--good);color:#fff}
.mini{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
.barrow{display:grid;grid-template-columns:76px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.bar-t{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--deep);border-radius:5px}
.bar-t i.w1{box-shadow:inset 0 0 0 1.5px #888}
.scen .barrow{grid-template-columns:120px 1fr 44px}
.barrow b{text-align:right;font-size:14px}
h3.sub{font-size:13px;margin:10px 0 4px;color:var(--muted)}
.deme{width:100%}
.deme th,.deme td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px;text-align:right}
.deme th:first-child,.deme td:first-child{text-align:left}
.deme th{font-size:11px;color:var(--muted);font-weight:500}
.deme .num{font-family:var(--display);font-size:16px}

.lnk{color:var(--accent);font-weight:700;text-decoration:underline}
.seg{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.seg button{flex:1;min-width:max-content;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:700;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}

.inp.amt{width:84px;margin:0;padding:4px 6px}

button.ov{border:0;border-bottom:1px solid #d0d0d0;width:100%;cursor:pointer}

.hist td.jp{font-family:var(--body);font-size:15px;font-weight:900}
.hist td.small{font-size:13px}
.odds th,.odds td{border:1px solid var(--line);padding:5px 2px;text-align:center;font-family:var(--display);font-size:16px;min-width:46px}
.odds th{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500;background:var(--surface)}

@media (prefers-reduced-motion:no-preference){.race,.rec{transition:transform .08s} .race:active,.rec:active{transform:scale(.99)}}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<div class="demo" id="demo" hidden></div>
<main id="main"></main>
<nav class="tabs" role="tablist" id="nav">
  <button role="tab" data-tab="home" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button role="tab" data-tab="program" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>出走表</button>
  <button role="tab" data-tab="money" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>収支</button>
  <button role="tab" data-tab="data" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>データ</button>
</nav>

<script src="config.js"></script>
<script>
const DEMO = (() => { const el = document.getElementById('data'); if (!el) return null; try { return JSON.parse(el.textContent); } catch (e) { return null; } })();
const CFG = window.BOAT_CONFIG || {};
const st = {tab: 'home', venue: null, race: null, rtab: 'entry', player: 1, open: {}};
try { const v = localStorage.getItem('boat-venue'); if (v) st.venue = v; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v == null ? '—' : (v * 100).toFixed(1);
const yen = v => v == null ? '—' : Number(v).toLocaleString('ja-JP');
const waku = n => `<span class="waku w${n}">${n}</span>`;
const stars = n => '<span class="stars" aria-label="勝負度' + n + '">' + '★'.repeat(n) + '<span class="off">' + '★'.repeat(3 - n) + '</span></span>';
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const todayStr = () => new Date().toLocaleDateString('sv-SE', {timeZone: 'Asia/Tokyo'});
const nowStr = () => DEMO ? DEMO["今"] : new Date().toLocaleTimeString('ja-JP', {timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false});
const left = t => mins(t) - mins(nowStr());
const recLabel = r => r["おすすめ"] ? `<span class="chip ${r["おすすめ"]["区分"]}">${r["おすすめ"]["区分"]}</span>` : '';

/* ---------- データ（GitHub の data ブランチから。暗号を解いて使う） ---------- */
let IDX = null, RACES = {}, ODDS = {}, LOAD = {err: '', at: null, busy: false};
const allRaces = () => IDX ? IDX["場"].flatMap(v => v["レース"].map(r => ({v, r}))) : [];
const keyOf = (code, rno) => `${code}-${rno}`;
function appDb() { return new Promise((res, rej) => { const q = indexedDB.open('boat-app', 1); q.onupgradeneeded = () => { const d = q.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); }; q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kv(k) { try { const d = await appDb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } }
async function decrypt(b64text, keyB64) {
  const raw = Uint8Array.from(atob(b64text.trim()), c => c.charCodeAt(0));
  const kb = Uint8Array.from(atob(keyB64), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function fetchEnc(name) {
  const k = await kv('dataKey'); if (!k) throw new Error('nokey');
  const repo = await kv('repo'), tok = await kv('ghToken');
  const h = {Accept: 'application/vnd.github.raw'}; if (tok) h.Authorization = 'Bearer ' + tok;
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${name}.enc?ref=data&t=${Date.now()}`, {headers: h, cache: 'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return decrypt(await r.text(), k);
}
function demoInit() {
  const p = DEMO["今日の収支"];
  IDX = {"日付": DEMO["日付"], "更新": DEMO["今"], "資金": DEMO["資金"] - p["購入"] + p["払戻"], "今日の収支": p, "今日の走り": {},
    "場": DEMO["場"].map(v => ({"場コード": v["場コード"], "場名": v["場名"], "コース別1着率": (v["場の特徴"] || {})["コース別1着率"] || {},
      "レース": v["レース"].map(r => { RACES[keyOf(v["場コード"], r["R"])] = r; return r; })}))};
}
async function loadIndex() {
  if (DEMO) return;
  try {
    const d = await fetchEnc(`days/${todayStr()}/index`);
    LOAD.err = d ? '' : 'nodata'; if (d) { IDX = d; LOAD.at = d["更新"]; }
  } catch (e) { LOAD.err = e.message === 'nokey' ? 'nokey' : 'データを読めませんでした（' + e.message + '）'; }
}
async function loadRace(code, rno) {
  if (DEMO) return RACES[keyOf(code, rno)];
  try { const r = await fetchEnc(`days/${todayStr()}/${code}-${rno}`); if (r) RACES[keyOf(code, rno)] = r; } catch (e) {}
  return RACES[keyOf(code, rno)];
}
async function loadOdds() {
  if (DEMO) return;
  try { const o = await fetchEnc(`days/${todayStr()}/odds`); if (o) ODDS = o; } catch (e) {}
}
async function refresh() {
  if (LOAD.busy) return; LOAD.busy = true;
  await loadIndex();
  if (st.tab === 'money' && !st.race) await loadLedger();
  if (st.race) {
    const {code, rno} = st.race;
    await Promise.all([loadRace(code, rno), loadOdds()]);
  }
  LOAD.busy = false; render(true);
}

/* ---------- 家族への共有（招待コード） ---------- */
async function setKv(k, v) { const d = await appDb(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function encryptObj(obj) {
  const kb = Uint8Array.from(atob(await kv('dataKey')), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  let bin = ''; all.forEach(b => bin += String.fromCharCode(b)); return btoa(bin);
}
const b64uDec = str => decodeURIComponent(escape(atob((str + '='.repeat((4 - str.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'))));
let INVITE = null, SHOW_INVITE = false, INVITE_MSG = '';
async function makeInvite() {
  const k = await kv('dataKey'), t = await kv('ghToken'), r = await kv('repo');
  if (!k || !t) { INVITE_MSG = 'この端末にはまだデータの鍵がありません'; return render(true); }
  INVITE = 'BRI.' + b64u(JSON.stringify({k, t, r})); SHOW_INVITE = true; render(true);
}
async function copyInvite() { try { await navigator.clipboard.writeText(INVITE); INVITE_MSG = 'コピーしました。LINEなどで家族に送ってください'; } catch (e) { INVITE_MSG = '枠の中を長押ししてコピーしてください'; } render(true); }
function inviteCard() {
  if (DEMO || !IDX) return '';
  return `<section class="card setup"><h2>家族に共有</h2>
    ${SHOW_INVITE ? `<ol><li>下の招待コードをLINEなどで家族に送る</li><li>家族はSafariで <b>${esc(location.href.split('?')[0])}</b> を開いて「ホーム画面に追加」</li><li>ホーム画面から開き、「招待コードで登録」に貼り付ける</li><li>数分で「登録しました」の通知が届けば完了（パソコンが動いている時間）</li></ol>
      <div class="code">${esc(INVITE)}</div><button class="btn" id="copyinv">招待コードをコピー</button>
      <p class="note">招待コードには、データを読むための鍵が入っています。家族以外には送らないでください。</p>`
    : `<p class="note">家族のiPhoneでも、同じ予想と通知を受け取れるようにします。</p><button class="btn" id="invite">招待コードを作る</button>`}
    ${INVITE_MSG ? `<p class="note">${esc(INVITE_MSG)}</p>` : ''}</section>`;
}
async function useInvite() {
  const code = ($('#invcode').value || '').trim(), name = ($('#myname').value || '').trim() || '家族の端末';
  let o; try { if (!code.startsWith('BRI.')) throw 0; o = JSON.parse(b64uDec(code.slice(4))); if (!o.k || !o.t) throw 0; } catch (e) { SETUP_MSG = '招待コードの形が違います。BRI. から最後まで全部貼ってください'; return render(); }
  await enablePush(true);
  if (!SUBCODE) return;
  await setKv('dataKey', o.k); await setKv('ghToken', o.t); if (o.r) await setKv('repo', o.r);
  try {
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription();
    const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
    const body = {message: 'subscribe', branch: 'data', content: btoa(await encryptObj({sub: sub.toJSON(), name, at: new Date().toISOString()}))};
    const r = await fetch(`https://api.github.com/repos/${o.r}/contents/subs/${id}.enc`, {method: 'PUT', headers: {Authorization: 'Bearer ' + o.t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error('GitHub ' + r.status);
    SETUP_MSG = '登録を受け付けました。パソコンが動いている時間なら、数分で「登録しました」の通知が届きます。';
    await refresh();
  } catch (e) { SETUP_MSG = '登録できませんでした（' + e.message + '）'; }
  render();
}

/* ---------- 通知の登録 ---------- */
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function urlB64ToUint8(b) { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let SUBCODE = null, SETUP_MSG = '';
async function enablePush(quiet) {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { SETUP_MSG = 'この画面では通知が使えません。Safariの共有ボタンから「ホーム画面に追加」して、ホーム画面のアイコンから開いてください。'; return render(); }
    if (!CFG.vapidPublicKey) { SETUP_MSG = 'config.js がありません。パソコンで python setup.py を動かして、pwa フォルダを置き直してください。'; return render(); }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { SETUP_MSG = '通知が許可されませんでした。iPhoneの設定 → 通知 → boat race で許可してください。'; return render(); }
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64ToUint8(CFG.vapidPublicKey)});
    SUBCODE = 'BR1.' + b64u(JSON.stringify(sub.toJSON()));
    SETUP_MSG = '';
  } catch (e) { SETUP_MSG = '登録できませんでした（' + e.message + '）'; }
  if (!quiet) render();
}
async function copyCode() { try { await navigator.clipboard.writeText(SUBCODE); SETUP_MSG = 'コピーしました。パソコンで python subscribe.py を動かして貼り付けてください。'; } catch (e) { SETUP_MSG = 'コピーできませんでした。枠の中を長押ししてコピーしてください。'; } render(); }
function setupCard() {
  if (DEMO || (IDX && LOAD.err !== 'nokey')) return '';
  const steps = !standalone
    ? `<ol><li>Safariの共有ボタンから「ホーム画面に追加」</li><li>ホーム画面の boat race から開き直す</li></ol>`
    : `<ol><li>下のボタンで通知をオンにする</li><li>出てきた登録コードをコピー</li><li>パソコンで <b>python subscribe.py</b> を動かして貼り付け</li><li>「データの受け取り準備ができました」の通知が来たら完了</li></ol>`;
  return `<section class="card setup"><h2>はじめの設定</h2>${steps}
    ${standalone ? `<button class="btn primary" id="enable">通知をオンにする</button>
      <details style="margin-top:12px"><summary>家族から招待コードをもらった場合</summary>
        <label class="note" for="myname">この端末の名前</label><input id="myname" class="inp" placeholder="例：母のiPhone">
        <label class="note" for="invcode">招待コード（BRI.〜）</label><input id="invcode" class="inp" placeholder="BRI.">
        <button class="btn primary" id="useinv">招待コードで登録</button></details>` : ''}
    ${SUBCODE ? `<div class="code">${esc(SUBCODE)}</div><button class="btn" id="copy">登録コードをコピー</button>` : ''}
    ${SETUP_MSG ? `<p class="note">${esc(SETUP_MSG)}</p>` : ''}</section>`;
}

function header() {
  const ds = IDX ? IDX["日付"] : todayStr();
  const d = new Date(ds + 'T00:00:00+09:00');
  const wd = '日月火水木金土'[d.getDay()];
  if (st.race) {
    const v = (IDX ? IDX["場"] : []).find(x => x["場コード"] === st.race.code) || {};
    $('#hdr').innerHTML = `<button class="back" id="back" aria-label="戻る">‹</button><h1>${esc(v["場名"] || '')}</h1><span class="date">${d.getMonth() + 1}/${d.getDate()}</span>`;
    $('#back').onclick = () => { st.race = null; render(); };
  } else {
    $('#hdr').innerHTML = `<img class="logo" src="logo-64.png" alt="" width="30" height="30"><h1>boat race</h1><span class="date">${d.getMonth() + 1}/${d.getDate()} (${wd})</span>`;
  }
  const demo = $('#demo');
  if (DEMO) { demo.hidden = false; demo.textContent = `試作版：${DEMO["日付"].replace(/-/g, '/')} ${DEMO["今"]} 時点の実データ（オッズはモデルの確率で代用）`; }
  else if (LOAD.err && LOAD.err !== 'nokey') { demo.hidden = false; demo.textContent = LOAD.err === 'nodata' ? '今日のデータはまだありません（パソコンの朝の準備のあとに出ます）' : LOAD.err; }
  else if (LOAD.at) { demo.hidden = false; demo.textContent = `${LOAD.at} 更新`; }
  else demo.hidden = true;
}

function recCard({v, r}) {
  const rec = r["おすすめ"];
  const sh = rec["区分"] === '勝負';
  const lm = left(r["締切"]);
  const tk = (r["勝負買い目"] || []).length
    ? `<div class="tickets">${r["勝負買い目"].map(t => `<span class="ticket"><small>${t["券種"]}</small>${t["買い目"]}<small style="margin-left:6px">${yen(t["金額"])}円</small></span>`).join('')}</div>` : '';
  const sub = rec["状態"] === '展示待ち' ? '展示待ち（直前情報で最終判定）' : esc(r["説明"] ?? (r["展開"] || {})["説明"] ?? '');
  return `<button class="rec ${sh ? 'shobu' : ''}" data-v="${v["場コード"]}" data-r="${r["R"]}">
    <span class="place">${esc(v["場名"])}<span class="num">${r["R"]}R</span></span>
    <span>${recLabel(r)} ${stars(rec["勝負度"])}</span>
    <span class="time">${r["締切"]}<small>${lm >= 0 ? 'あと' + lm + '分' : '締切済み'}</small></span>
    <span class="sub">${sub}</span>${tk}</button>`;
}

function home() {
  if (!IDX) return `<div class="wrap">${setupCard()}${LOAD.err === 'nokey' || DEMO ? '' : '<p class="empty">読み込み中…</p>'}</div>`;
  const p = Object.assign({"購入": 0, "払戻": 0, "件数": 0, "明細": []}, IDX["今日の収支"]);
  const rate = p["購入"] ? p["払戻"] / p["購入"] : null;
  const diff = p["払戻"] - p["購入"];
  const up = allRaces().filter(x => x.r["おすすめ"] && x.r["状態"] !== '結果')
    .sort((a, b) => (b.r["おすすめ"]["区分"] === '勝負') - (a.r["おすすめ"]["区分"] === '勝負') || mins(a.r["締切"]) - mins(b.r["締切"]));
  const done = p["明細"];
  return `<div class="wrap">${setupCard()}
    <section class="card" aria-labelledby="pl"><h2 id="pl">今日の収支（勝負レース）</h2>
      <div class="pl-row"><div><small>購入</small><b>${yen(p["購入"])}</b></div>
      <div><small>払戻</small><b>${yen(p["払戻"])}</b></div>
      <div><small>収支</small><b class="${diff >= 0 ? 'pos' : 'neg'}">${diff >= 0 ? '+' : ''}${yen(diff)}</b></div></div>
      <div class="pl-row"><div><small>回収率</small><b>${rate == null ? '—' : (rate * 100).toFixed(0) + '%'}</b></div>
      <div><small>勝負</small><b>${p["件数"]}<small> 点</small></b></div>
      <div><small>資金</small><b>${yen(IDX["資金"])}</b></div></div>
      ${done.map(b => `<div class="sub" style="margin-top:8px;font-size:13px">${esc(b["場名"])}${b["R"]}R ${b["券種"]} ${b["買い目"]} ${yen(b["金額"])}円 → <span class="${b["結果"] === '的中' ? 'hit' : ''}">${b["結果"]} ${yen(b["払戻"])}円</span></div>`).join('')}
    </section>
    <h2>直近のおすすめレース</h2>

/* 1マーク到達の予想：スタート（ST）と伸び（展示タイム）から各艇の前後を計算し、

}
function nobiOf(r) {
  const ori = r["オリジナル展示"] && r["オリジナル展示"]["値"];
  if (ori && [1, 2, 3, 4, 5, 6].every(b => ori[b] && ori[b]["直線"] != null)) {
    const m = {}; [1, 2, 3, 4, 5, 6].forEach(b => m[b] = ori[b]["直線"]);
    return {kind: '直線', vals: m, scale: 0.3, good: 0.05, bad: 0.20};
  }
  if (r["展示"]) { const m = {}; Object.entries(r["展示"]).forEach(([b, v]) => m[b] = v); return {kind: '展示', vals: m, scale: 0.6, good: 0.03, bad: 0.10}; }

function turnModel(r) {

  const tmin = tvals.length ? Math.min(...tvals) : null;
  const sc = r["展開"], runner = sc["抜け出し"], kind = sc["種類"];
  const boats = r["出走"].map(e => {
    const b = e["艇番"], c = co[b];
    const st = stOf(r, e, c).st;
    const tj = t && t[b] != null ? t[b] : null;
    // 到達の早さ（100分の1秒単位）：STが速いほど前、展示が速いほど伸びて前、外のコースほど回る距離が長い
    const startPt = -st * 100;
    const nobi = tj != null ? -(tj - tmin) * 100 * nb.scale : 0;

    return {b, c, st, tj, startPt, nobi, reach: startPt + nobi + dist};

  boats.forEach(x => { x.s = 34 + (x.reach - best) * 3.2; x.rad = 22 + (x.c - 1) * 13; });
  const by = c => boats.find(x => x.c === c);

    const rb = boats.find(x => x.b === runner);
    if (kind === 'まくり差し') {
      // 1号艇が外の攻めを受けて膨らみ、抜け出した艇はその内側へ
      one.rad = Math.max(one.rad, 44);
      rb.rad = 20;
      rb.s = Math.min(rb.s, one.s - 6);

      const passed = boats.filter(x => x.c < rb.c);
      rb.rad = Math.max(...passed.map(x => x.rad)) + 16;

/* ---------- 展開の確率と、このレースの買い目候補（確率×オッズ） ---------- */
const EV_MIN = 1.1, P3_MIN = 0.01, P2_MIN = 0.02;
function candidates(r) {
  const od = oddsOf(r), out = [];
  for (const [kind, key, pmin] of [['3連単', '3連単確率', P3_MIN], ['2連単', '2連単確率', P2_MIN]]) {
    const probs = r[key] || {}, o = od[kind] || {};
    for (const [c, p] of Object.entries(probs)) {
      if (p < pmin || o[c] == null) continue;
      const ev = p * o[c];
      if (ev >= EV_MIN) out.push({kind, c, p, o: o[c], ev});
    }
  }
  return out.sort((a, b) => b.ev - a.ev);
}
function tkRow(kind, c, p, o, ev) {
  return `<tr><td><button class="addb" data-add="${kind}|${c}" aria-pressed="${cartHas(kind, c)}" aria-label="記録に追加">${cartHas(kind, c) ? '✓' : '＋'}</button> ${kind}</td><td class="c">${c}</td><td class="p">${(p * 100).toFixed(1)}%</td><td class="p">${o != null ? o.toFixed(1) + '倍' : '<span style="color:var(--muted)">—</span>'}</td><td class="p ${ev != null && ev >= 1 ? 'hit' : ''}">${ev != null ? ev.toFixed(2) : ''}</td></tr>`;
}
function probSection(r) {
  const sc = r["展開"] || {}, scen = sc["展開確率"] || [], p1 = r["1着確率"] || {};
  const mx = Math.max(...scen.map(x => x["確率"]), 0.01);
  const scenHtml = scen.length ? `<div class="bars scen">${scen.slice(0, 6).map(x => `<div class="barrow"><span class="bl-l">${esc(x["展開"])}</span><span class="bar-t"><i style="width:${(x["確率"] / mx * 100).toFixed(1)}%"></i></span><b class="num">${(x["確率"] * 100).toFixed(0)}%</b></div>`).join('')}</div>` : '';
  const winHtml = `<div class="bars">${[1, 2, 3, 4, 5, 6].map(b => `<div class="barrow"><span class="bl-l">${waku(b)}</span><span class="bar-t"><i class="w${b}" style="background:var(--c${b});width:${((p1[b] || 0) * 100).toFixed(1)}%"></i></span><b class="num">${((p1[b] || 0) * 100).toFixed(0)}%</b></div>`).join('')}</div>`;
  const od = oddsOf(r), hasOdds = !!(od["3連単"] && Object.keys(od["3連単"]).length);
  const cand = hasOdds ? candidates(r) : [];
  const c3 = cand.filter(x => x.kind === '3連単').slice(0, 8), c2 = cand.filter(x => x.kind === '2連単').slice(0, 4);
  const head = '<thead><tr><th>券種</th><th>買い目</th><th>確率</th><th>オッズ</th><th>期待値</th></tr></thead>';
  let candHtml;
  if (!hasOdds) {
    candHtml = `<p class="note">オッズは締切の30分前から出ます。出たら、確率×オッズが${EV_MIN}以上の買い目をここに並べます。いまは確率の高い順です。</p>
      <table class="tk">${head}<tbody>${(r["予想買い目"] || []).map(x => tkRow(x["券種"], x["買い目"], x["確率"], null, null)).join('')}</tbody></table>`;
  } else if (!cand.length) {
    candHtml = `<p class="note">確率×オッズが${EV_MIN}以上の買い目はありません（見送り候補）。参考に確率の高い順を出します。</p>
      <table class="tk">${head}<tbody>${(r["予想買い目"] || []).map(x => { const o = (od[x["券種"]] || {})[x["買い目"]]; return tkRow(x["券種"], x["買い目"], x["確率"], o, o != null ? x["確率"] * o : null); }).join('')}</tbody></table>`;
  } else {
    candHtml = `<table class="tk">${head}<tbody>${[...c3, ...c2].map(x => tkRow(x.kind, x.c, x.p, x.o, x.ev)).join('')}</tbody></table>
      <p class="note">確率×オッズ（期待値）が${EV_MIN}以上で、確率が3連単${P3_MIN * 100}%・2連単${P2_MIN * 100}%以上のものを、期待値の高い順に。</p>`;
  }
  return `<section><h2>展開の確率</h2>${scenHtml}
      <h3 class="sub">1着の確率</h3>${winHtml}</section>
    <section><h2>このレースの買い目候補</h2>${candHtml}
      <p class="note">確率は、過去4年分のレースで「〇%と出たものが、ほぼ〇%当たる」ことを確かめたモデル（平均ST・展示・タイプ・1コースの負け方・級別・勝率・モーター）です。期待値で選んで儲かるかは、締切前オッズの記録がたまってから確かめます。</p></section>`;
}

  const nr = Object.keys(races).length, hit = Object.values(races).filter(Boolean).length;

let CART = null;   // {code, R, name, 締切, items: [{券種, 買い目, 金額}], open, kind, picks: [[],[],[]], amt}
const NEED = {'3連単': 3, '3連複': 3, '2連単': 2, '2連複': 2, '拡連複': 2, '単勝': 1, '複勝': 1};
function cartFor(code, R) {
  if (!CART || CART.code !== code || CART.R !== R) {
    const v = (IDX ? IDX["場"] : []).find(x => x["場コード"] === code) || {}, r = (v["レース"] || []).find(x => x["R"] === R) || {};
    CART = {code, R, name: v["場名"], "締切": r["締切"] || '', items: [], open: false, kind: '3連単', picks: [[], [], []], amt: 100, msg: ''};
  }
  return CART;
}
const ckey = (k, c) => k + ' ' + c;
function cartHas(kind, combo) { return CART && CART.items.some(x => ckey(x["券種"], x["買い目"]) === ckey(kind, combo)); }
function cartToggle(kind, combo, amt) {
  const c = cartFor(st.race.code, st.race.rno);
  const i = c.items.findIndex(x => ckey(x["券種"], x["買い目"]) === ckey(kind, combo));
  if (i >= 0) c.items.splice(i, 1); else c.items.push({"券種": kind, "買い目": combo, "金額": amt || c.amt});
  render(true);
}
function formation(kind, picks) {
  const n = NEED[kind], ps = picks.slice(0, n), out = [];
  const ordered = kind === '3連単' || kind === '2連単';
  if (n === 1) return ps[0].map(String);
  const rec = (i, cur) => {
    if (i === n) { if (new Set(cur).size === n) out.push(cur); return; }
    (ordered ? ps[i] : ps[0].concat(ps[1] || [], ps[2] || [])).forEach(b => rec(i + 1, cur.concat(b)));
  };
  if (ordered) { rec(0, []); return [...new Set(out.map(x => x.join('-')))]; }
  // 連複：選んだ艇（ボックス）から組み合わせ
  const pool = [...new Set(ps.flat())].sort();
  const res = [];
  const comb = (start, cur) => { if (cur.length === n) { res.push(cur.join('=')); return; } for (let i = start; i < pool.length; i++) comb(i + 1, cur.concat(pool[i])); };
  comb(0, []);
  return res;
}
function cartBar() {
  const c = CART && st.race && CART.code === st.race.code && CART.R === st.race.rno ? CART : null;
  const n = c ? c.items.length : 0, sum = c ? c.items.reduce((a, x) => a + Number(x["金額"] || 0), 0) : 0;
  return `<div class="cartbar"><button class="btn ${n ? 'primary' : ''}" id="cartopen">${n ? `記録する買い目 ${n}点・${yen(sum)}円 ›` : '＋ このレースの買い目を記録'}</button></div>`;
}

  const made = formation(c.kind, c.picks);

  return `<section class="card cart"><div class="cart-h"><h2>${esc(c.name)}${c.R}R の買い目を記録</h2><button class="mini" id="cartclose">閉じる</button></div>

    <p class="note">予想タブの買い目や、オッズの表のマスを押しても追加できます。</p>
    ${c.items.length ? `<table class="tk cartlist"><tbody>${c.items.map((x, i) => `<tr><td>${esc(x["券種"])}</td><td class="c">${esc(x["買い目"])}</td>
      <td><input class="inp amt" type="number" inputmode="numeric" step="100" value="${x["金額"]}" data-amt="${i}" aria-label="金額"></td><td><button class="mini" data-rm="${i}">外す</button></td></tr>`).join('')}</tbody></table>
      <div class="row"><b class="num" style="font-size:20px">${c.items.length}点・${yen(sum)}円</b><button class="btn primary" id="cartsend">記録する</button></div>` : '<p class="empty">まだ買い目がありません</p>'}
    ${c.msg ? `<p class="note">${esc(c.msg)}</p>` : ''}</section>`;
}
async function cartSend() {
  const c = CART;
  document.querySelectorAll('[data-amt]').forEach(el => { c.items[Number(el.dataset.amt)]["金額"] = Number(el.value); });
  if (c.items.some(x => !x["金額"] || x["金額"] % 100)) { c.msg = '金額は100円単位で入れてください'; return render(true); }
  if (DEMO) { c.msg = '試作版では記録できません（本番版ではこのままパソコンに送られます）'; return render(true); }
  const item = {type: 'bets', id: Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join(''),
    "日付": todayStr(), "場コード": c.code, "場名": c.name, "R": c.R, "締切": c["締切"], items: c.items.map(x => ({...x}))};
  try {
    await writeInbox(item);
    item.items.forEach((x, j) => ui.pending.push({id: item.id + '-' + j, "場名": c.name, "R": c.R, "券種": x["券種"], "買い目": x["買い目"], "金額": x["金額"]}));
    savePending();
    c.items = []; c.open = false; c.msg = '';
    ui.msg = `${c.name}${c.R}R の買い目を送りました。5分以内に収支タブに入ります。`;
    st.race = null; st.tab = 'money'; render(); $('#main').scrollTop = 0;
  } catch (e) { c.msg = '送れませんでした（' + e.message + '）'; render(true); }
}

function render(keepScroll) {
  header();
  const m = $('#main'), y = m.scrollTop;
  m.innerHTML = st.race ? raceView() : ({home, program, money: moneyTab, data: dataTab}[st.tab] || home)();
  if (keepScroll) m.scrollTop = y;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', String(!st.race && b.dataset.tab === st.tab)));
}
async function openRace(code, rno) {
  st.race = {code, rno: Number(rno)}; st.open = {}; st.player = 1;
  const s0 = (allRaces().find(x => x.v["場コード"] === code && x.r["R"] === Number(rno)) || {}).r || {};
  st.rtab = s0["状態"] === '結果' ? 'result' : (s0["おすすめ"] ? 'predict' : 'entry');
  render(); $('#main').scrollTop = 0;
  await Promise.all([loadRace(code, rno), loadOdds()]);
  if (st.race && st.race.code === code) render(true);
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.id === 'enable') return enablePush();
  if (t.id === 'copy') return copyCode();
  if (t.id === 'invite') return makeInvite();
  if (t.id === 'copyinv') return copyInvite();
  if (t.id === 'useinv') return useInvite();
  if (t.dataset.tab) { st.tab = t.dataset.tab; st.race = null; render(); $('#main').scrollTop = 0;
    if (st.tab === 'money') loadLedger().then(() => render(true));
    if (st.tab === 'data') loadStats().then(() => render(true)); }
  else if (t.dataset.go) { openRace(t.dataset.go, t.dataset.gor).then(() => { st.rtab = 'entry'; render(); }); }
  else if (t.id === 'cartopen') { const c = cartFor(st.race.code, st.race.rno); c.open = !c.open; render(true); if (c.open) $('#main').scrollTop = 0; }
  else if (t.id === 'cartclose') { CART.open = false; render(true); }
  else if (t.dataset.ck) { CART.kind = t.dataset.ck; CART.picks = [[], [], []]; render(true); }
  else if (t.dataset.pk) { const [i, b] = t.dataset.pk.split('-').map(Number); const a = CART.picks[i]; const j = a.indexOf(b); j >= 0 ? a.splice(j, 1) : a.push(b); render(true); }
  else if (t.id === 'cadd') { const amt = Number($('#camt').value) || 100; CART.amt = amt; formation(CART.kind, CART.picks).forEach(cb => { if (!cartHas(CART.kind, cb)) CART.items.push({"券種": CART.kind, "買い目": cb, "金額": amt}); }); CART.picks = [[], [], []]; render(true); }
  else if (t.dataset.rm) { CART.items.splice(Number(t.dataset.rm), 1); render(true); }
  else if (t.id === 'cartsend') { cartSend(); }
  else if (t.dataset.add) { const [k, cb] = t.dataset.add.split('|'); cartToggle(k, cb); }
  else if (t.dataset.shobu) { const r = RACES[keyOf(st.race.code, st.race.rno)]; const c = cartFor(st.race.code, st.race.rno); (r["勝負買い目"] || []).forEach(x => { if (!cartHas(x["券種"], x["買い目"])) c.items.push({"券種": x["券種"], "買い目": x["買い目"], "金額": x["金額"]}); }); c.open = true; render(); $('#main').scrollTop = 0; }
  else if (t.dataset.period) { ui.period = t.dataset.period; render(true); }
  else if (t.dataset.del) { delBet(t.dataset.del); }
  else if (t.dataset.skip) { const [ty, id] = t.dataset.skip.split('|'); if (DEMO) { ui.msg = '試作版では送れません'; render(true); } else writeInbox({type: ty, id}).then(() => { ui.msg = ty === 'skip' ? '「買っていない」を送りました。5分以内に収支から外れます。' : '「買った」を送りました。'; render(true); }).catch(e => { ui.msg = '送れませんでした（' + e.message + '）'; render(true); }); }
  else if (t.id === 'banksave') { saveBank(); }
  else if (t.id === 'betsave') { saveBet(); }
  else if (t.dataset.dv) { ui.dv = t.dataset.dv; render(true); }
  else if (t.dataset.kim) { ui.kim = t.dataset.kim; render(true); }
  else if (t.dataset.crs) { ui.course = t.dataset.crs; render(true); }
  else if (t.dataset.wind) { ui.wind = t.dataset.wind; render(true); }
  else if (t.dataset.venue) { st.venue = t.dataset.venue; try { localStorage.setItem('boat-venue', st.venue); } catch (e) {} render(); }
  else if (t.dataset.r && t.dataset.v) openRace(t.dataset.v, t.dataset.r);
  else if (t.dataset.rtab) { st.rtab = t.dataset.rtab; render(); $('#main').scrollTop = 0; }
  else if (t.dataset.player) { const p = Number(t.dataset.player); st.open[p] = !st.open[p]; render(true); }
  else if (t.dataset.pl) { st.player = Number(t.dataset.pl); render(true); }
});
(async () => {
  if (DEMO) { demoInit(); render(); return; }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'refresh') refresh(); });
    try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); if (sub) SUBCODE = 'BR1.' + b64u(JSON.stringify(sub.toJSON())); } catch (e) {}
  }
  render(); await refresh();
  setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
